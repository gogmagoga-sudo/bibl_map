<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Библейские места — интерактивный справочник</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{
    --bg:#f3eee4;
    --panel:#fffdf8;
    --ink:#2b2620;
    --muted:#8a7d6b;
    --line:#e6dcc9;
    --accent:#8a5a2b;
    --accent-soft:#efe0c9;
    --gold:#c9a227;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ── Шапка ── */
  header{
    flex-shrink:0;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:13px 20px;
    background:linear-gradient(135deg,#3b2f23 0%,#5a4632 100%);
    color:#f6efe2;
    border-bottom:3px solid var(--gold);
    box-shadow:0 2px 12px rgba(43,38,32,.18);
    z-index:10;
  }
  .brand{display:flex;align-items:center;gap:13px;min-width:0}
  .logo{
    width:38px;height:38px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid rgba(201,162,39,.65);
    border-radius:50%;
    font-size:19px;color:var(--gold);
  }
  header h1{font-size:19px;font-weight:600;letter-spacing:.25px;line-height:1.2}
  .sub{font-size:12px;opacity:.68;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stats{font-size:13px;opacity:.85;white-space:nowrap;flex-shrink:0}
  .stats b{color:var(--gold);font-size:16px;font-weight:700}

  /* ── Раскладка ── */
  .main{flex:1;display:flex;min-height:0}

  .sidebar{
    width:430px;flex-shrink:0;
    display:flex;flex-direction:column;
    background:var(--panel);
    border-right:1px solid var(--line);
    min-height:0;
  }

  .search-wrap{padding:13px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
  .search-box{position:relative}
  .search-box input{
    width:100%;
    padding:10px 34px 10px 36px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    font-family:inherit;font-size:14px;color:var(--ink);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-box input::placeholder{color:#b3a794}
  .search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(138,90,43,.13)}
  .search-box .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;pointer-events:none}

  .list{flex:1;overflow-y:auto;padding:13px 13px 26px;min-height:0;scrollbar-width:thin;scrollbar-color:#d5c7b0 transparent}
  .list::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-thumb{background:#d5c7b0;border-radius:9px;border:2px solid var(--panel)}
  .list::-webkit-scrollbar-track{background:transparent}

  /* ── Карточки ── */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px 11px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .card:hover{border-color:#d9c7a7;box-shadow:0 3px 12px rgba(90,70,50,.08)}
  .card.active{
    border-color:var(--accent);
    background:#fffaf0;
    box-shadow:0 0 0 2px rgba(138,90,43,.14), 0 3px 12px rgba(90,70,50,.1);
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:9px}
  .card h3{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.25}
  .badge-off{
    flex-shrink:0;
    font-size:9.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
    color:#a38f6e;background:#f2e9d9;border-radius:20px;padding:3px 8px;
  }
  .verse{
    margin:8px 0 0;
    padding-left:10px;
    border-left:2.5px solid var(--accent-soft);
    font-size:12.5px;line-height:1.5;
    color:#6d6355;
    font-style:italic;
  }
  .ref{
    display:inline-block;
    margin-top:7px;
    font-size:11.5px;font-weight:700;letter-spacing:.2px;
    color:var(--accent);
    background:#f7edda;
    border-radius:6px;
    padding:2px 8px;
  }
  .desc{font-size:13px;line-height:1.5;color:#4c463d;margin-top:8px}
  .coords{
    margin-top:9px;
    font-size:11px;color:var(--muted);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.2px;
  }
  .empty{
    text-align:center;color:var(--muted);
    font-size:13.5px;padding:44px 20px;line-height:1.6;
  }

  /* ── Карта ── */
  #map{flex:1;min-width:0;min-height:0;background:#e6ded0;z-index:1}
  .dot-wrap{background:none;border:none}
  .marker-dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--accent);
    border:2px solid #fff;
    box-shadow:0 1px 5px rgba(0,0,0,.4);
    transition:transform .18s, background .18s, box-shadow .18s;
    cursor:pointer;
  }
  .marker-dot:hover{transform:scale(1.22)}
  .marker-dot.active{
    background:var(--gold);
    transform:scale(1.35);
    box-shadow:0 0 0 5px rgba(201,162,39,.28), 0 1px 5px rgba(0,0,0,.35);
  }
  .leaflet-popup-content{font-family:inherit;font-size:13px;line-height:1.45;margin:11px 14px}
  .leaflet-popup-content b{color:var(--accent);font-size:14px}
  .pop-ref{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:#f7edda;border-radius:5px;padding:1px 7px;margin:3px 0 6px}

  /* ── Мобильная версия ── */
  @media (max-width: 900px){
    .app{height:auto;min-height:100vh;overflow:visible}
    .main{flex-direction:column}
    #map{flex:none;height:52vh;order:-1;border-bottom:1px solid var(--line)}
    .sidebar{width:100%;border-right:none}
    .list{overflow:visible;max-height:none}
    header h1{font-size:17px}
    .sub{display:none}
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo">✝</div>
      <div>
        <h1>Библейские места</h1>
        <div class="sub">Интерактивный справочник мест Священного Писания</div>
      </div>
    </div>
    <div class="stats"><b id="count">0</b> <span id="countWord">мест</span></div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="search-wrap">
        <div class="search-box">
          <span class="ico">🔍</span>
          <input id="search" type="search" placeholder="Поиск по названию, писанию или описанию…" autocomplete="off">
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

/* ─────────────────────────── КАРТА ─────────────────────────── */
const map = L.map('map', {
  center: [31.8, 35.25],
  zoom: 8,
  zoomControl: true,
  worldCopyJump: true
});

// Замена слоя OSM на Esri World Street Map (не требует API-ключа)
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012',
  maxZoom: 18
}).addTo(map);

/* ─────────────────────────── РЕНДЕР ─────────────────────────── */
const listEl   = document.getElementById('list');
const searchEl = document.getElementById('search');
const countEl  = document.getElementById('count');
const countWordEl = document.getElementById('countWord');

const markers = new Array(places.length).fill(null);
const cards   = [];
let activeIndex = -1;

function hasCoords(p){ return p.lat !== null && p.lng !== null; }

function fmtCoord(v){ return v.toFixed(4).replace('.', ','); }

function plural(n){
  const m = n % 100;
  if (m >= 11 && m <= 14) return 'мест';
  const l = n % 10;
  if (l === 1) return 'место';
  if (l >= 2 && l <= 4) return 'места';
  return 'мест';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* Карточки */
places.forEach((p, i) => {
  const el = document.createElement('article');
  el.className = 'card';
  el.dataset.index = i;

  const badge = hasCoords(p)
    ? ''
    : '<span class="badge-off">нет на карте</span>';

  const coordsText = hasCoords(p)
    ? `${fmtCoord(p.lat)}°, ${fmtCoord(p.lng)}°`
    : 'Точное место сейчас неизвестно';

  el.innerHTML = `
    <div class="card-head">
      <h3>${escapeHtml(p.name)}</h3>
      ${badge}
    </div>
    <div class="verse">${escapeHtml(p.verse)}</div>
    <span class="ref">${escapeHtml(p.ref)}</span>
    <p class="desc">${escapeHtml(p.desc)}</p>
    <div class="coords">${coordsText}</div>
  `;

  el.addEventListener('click', () => select(i, false));
  listEl.appendChild(el);
  cards.push(el);
});

/* Маркеры */
function dotIcon(active){
  return L.divIcon({
    className: 'dot-wrap',
    html: `<div class="marker-dot${active ? ' active' : ''}"></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9],
    popupAnchor: [0, -11]
  });
}

places.forEach((p, i) => {
  if (!hasCoords(p)) return;

  const m = L.marker([p.lat, p.lng], { icon: dotIcon(false), title: p.name }).addTo(map);
  m.bindPopup(
    `<b>${escapeHtml(p.name)}</b><br>
     <span class="pop-ref">${escapeHtml(p.ref)}</span><br>
     ${escapeHtml(p.desc)}`,
    { maxWidth: 290, autoPanPadding: [26, 26] }
  );
  m.on('click', () => select(i, true));
  markers[i] = m;
});

/* ─────────────────────────── ВЫБОР ─────────────────────────── */
function select(i, fromMap){
  if (activeIndex === i && fromMap) {
    markers[i]?.openPopup();
    return;
  }

  if (activeIndex >= 0){
    cards[activeIndex]?.classList.remove('active');
    if (markers[activeIndex]) markers[activeIndex].setIcon(dotIcon(false));
  }

  activeIndex = i;
  cards[i].classList.add('active');

  if (!fromMap){
    cards[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  const p = places[i];
  if (markers[i]){
    markers[i].setIcon(dotIcon(true));
    map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 11), { duration: 0.75 });
    markers[i].openPopup();

    if (fromMap && window.innerWidth <= 900){
      document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
}

/* ─────────────────────────── ПОИСК ─────────────────────────── */
function applyFilter(){
  const q = searchEl.value.trim().toLowerCase();
  let visible = 0;

  places.forEach((p, i) => {
    const hay = (p.name + ' ' + p.ref + ' ' + p.desc + ' ' + p.verse).toLowerCase();
    const show = !q || hay.includes(q);

    cards[i].style.display = show ? '' : 'none';

    if (markers[i]){
      const onMap = map.hasLayer(markers[i]);
      if (show && !onMap) markers[i].addTo(map);
      if (!show && onMap) map.removeLayer(markers[i]);
    }

    if (show) visible++;
  });

  countEl.textContent = visible;
  countWordEl.textContent = plural(visible);

  const emptyEl = listEl.querySelector('.empty');
  if (visible === 0 && !emptyEl){
    const div = document.createElement('div');
    div.className = 'empty';
    div.innerHTML = 'Ничего не найдено.<br>Попробуйте изменить запрос.';
    listEl.appendChild(div);
  } else if (visible > 0 && emptyEl){
    emptyEl.remove();
  }
}

searchEl.addEventListener('input', applyFilter);
searchEl.addEventListener('search', applyFilter);

/* ─────────────────────────── СТАРТ ─────────────────────────── */
applyFilter();
setTimeout(() => map.invalidateSize(), 200);
window.addEventListener('resize', () => map.invalidateSize());
</script>
